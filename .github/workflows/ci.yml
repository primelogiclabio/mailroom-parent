name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test on JDK ${{ matrix.jdk }}
    strategy:
      fail-fast: false
      matrix:
        jdk: ['8', '21', '25']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # All three JDKs go into ~/.m2/toolchains.xml (versions 8, 25, 21); the last one, 21, runs Maven.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            8
            25
            21
          cache: maven
      - name: Build and install the parent
        run: ./mvnw -B install
      # The smoke project checks the parent's test-jdk switch and both Java sets: each module's tests must run on the
      # matrix JDK (on 8, the Java 21 module's tests skip).
      - name: Smoke test on JDK ${{ matrix.jdk }}
        run: ./mvnw -B -f src/it/smoke/pom.xml verify -Dtest.jdk=${{ matrix.jdk }}

  # The one required check in the branch ruleset: fails unless every matrix job passed.
  build-ok:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = success

  deploy-snapshot:
    needs: build-ok
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: primelogiclab-snapshots
          server-username-env-var: REPO_TOKEN_NAME
          server-password-env-var: REPO_TOKEN_SECRET
      - name: Deploy the snapshot to repo.primelogiclab.io
        run: ./mvnw -B deploy
        env:
          REPO_TOKEN_NAME: ${{ secrets.REPO_TOKEN_NAME }}
          REPO_TOKEN_SECRET: ${{ secrets.REPO_TOKEN_SECRET }}
